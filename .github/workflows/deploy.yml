name: TaleemX Auto-Deploy

on:
  push:
    branches:
      - merge-features  # Make sure this matches your deployment branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/TaleemX-Project
            git pull origin main
            
            # Rebuild the image to bake in Omnipay & Push Notification vendors
            docker compose up -d --build taleemx-php
            
            # Set permissions inside the container for the new vendor files
            docker exec taleemx_php chown -R www-data:www-data /var/www/html/application/third_party