name: TaleemX Auto-Deploy

on:
  push:
    branches:
      - merge-features

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/TaleemX-Project
            
            # FIX: Pull from the correct branch and force sync
            git fetch origin merge-features
            git reset --hard origin/merge-features
            
            # Rebuild the specific image
            docker compose up -d --build taleemx-php
            
            # Set permissions
            docker exec taleemx_php chown -R www-data:www-data /var/www/html/application/third_party